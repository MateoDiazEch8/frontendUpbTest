<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario UPB</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>📦 Inventario UPB</h1><p>Gestión de productos</p></header>
  <main>
    <section class="card">
      <h2 id="form-title">Nuevo producto</h2>
      <form id="form">
        <input type="hidden" id="id">
        <label>Nombre <input id="nombre" maxlength="100" required></label>
        <label>Precio <input id="precio" type="number" min="0" step="0.01" value="0" required></label>
        <label>Stock <input id="stock" type="number" min="0" step="1" value="0" required></label>
        <div class="actions">
          <button type="submit" id="guardar">Guardar</button>
          <button type="button" id="cancelar" class="secondary" hidden>Cancelar</button>
        </div>
      </form>
      <p id="msg" role="status"></p>
    </section>
    <section class="card">
      <h2>Productos <span id="total"></span></h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th></th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
